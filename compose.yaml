services:
  pihole:
    image: pihole/pihole:2026.07.2
    restart: unless-stopped
    environment:
      TZ: ${PIHOLE_TZ}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_upstreams: unbound#5335
      FTLCONF_dns_listeningMode: ALL
    volumes:
      - ./etc-pihole:/etc/pihole
    cap_add:
      - SYS_NICE
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    expose:
      - 80
    networks:
      - default
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`${PIHOLE_DOMAIN}`)"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    dns:
      - 127.0.0.1

  unbound:
    image: klutchell/unbound:1.26.0
    restart: unless-stopped
    volumes:
      - ./unbound:/etc/unbound/custom.conf.d
    expose:
      - "5335/tcp"
      - "5335/udp"
    networks:
      - default

networks:
  default:
    enable_ipv6: true
  proxy-network:
    external: true
